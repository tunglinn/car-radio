<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151515">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Car Radio">
<title>Car Radio</title>
<style>
  :root { color-scheme: dark; --cap: 66px; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; } /* app-like: no page scroll or bounce */
  body { margin: 0; height: 100dvh; display: grid; place-items: center; background: #151515; font-family: Helvetica, Arial, sans-serif; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  .unit { width: min(660px, calc(100vw - 32px)); box-sizing: border-box; padding: 18px; border-radius: 12px;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px), linear-gradient(#3a3a3a, #1c1c1c);
    box-shadow: 0 10px 40px #000, inset 0 1px #666, inset 0 -2px #000; }
  .top { display: flex; align-items: stretch; justify-content: space-between; flex-wrap: wrap; }

  .dial { flex: 1; margin: 0 16px; height: 112px; position: relative; overflow: hidden; border-radius: 6px; cursor: pointer; color: #ffb347;
    background: radial-gradient(ellipse at 50% 60%, #3a2508, #120a02 75%); box-shadow: inset 0 2px 12px #000, 0 1px #555; transition: filter .4s; }
  .dial.off { filter: brightness(.3) saturate(.3); }
  .tick { position: absolute; left: var(--p); top: 30px; width: 1px; height: 8px; background: currentColor; opacity: .7; }
  .tick.major { height: 14px; top: 24px; opacity: 1; }
  .label { position: absolute; left: var(--p); top: 8px; font-size: 11px; transform: translateX(-50%); text-shadow: 0 0 4px #ff9d1f; }
  .dot { position: absolute; left: var(--p); top: 44px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; opacity: .6; }
  .needle { position: absolute; left: var(--p); top: 4px; bottom: 30px; width: 2px; margin-left: -1px; background: #ff3b2f; box-shadow: 0 0 6px #ff3b2f; transition: left .08s, top .08s; }
  .readout { position: absolute; left: 12px; right: 12px; bottom: 8px; display: flex; justify-content: space-between; align-items: baseline;
    font-family: "Courier New", monospace; font-size: 15px; text-shadow: 0 0 6px #ff9d1f; white-space: nowrap; }
  .readout span:last-child { overflow: hidden; text-overflow: ellipsis; margin-left: 12px; }
  .lamp { position: absolute; right: 12px; top: 48px; font-size: 9px; letter-spacing: 1px; color: #ff3b2f; opacity: .15; }
  .lamp.on { opacity: 1; text-shadow: 0 0 6px #ff3b2f; }

  .capwrap { position: relative; } /* label stays centered on its own knob wherever the knob sits */
  .knob { width: 76px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; font-size: 10px; letter-spacing: 1px; color: #999; }
  .cap { width: var(--cap); height: var(--cap); flex: none; border-radius: 50%; position: relative; touch-action: none; cursor: ns-resize;
    background: radial-gradient(circle at 50% 50%, #5a5a5a 0 52%, #2a2a2a 54% 58%, transparent 59%), repeating-conic-gradient(#111 0 5deg, #4a4a4a 5deg 10deg);
    box-shadow: 0 5px 10px #000, 0 0 0 2px #0a0a0a; }
  .face { position: absolute; left: 0; right: 0; top: 0; height: var(--cap); line-height: var(--cap); font-size: 9px; font-weight: bold; letter-spacing: 1px; color: #bbb; text-shadow: 0 -1px #222; pointer-events: none; } /* sits over the cap but doesn't rotate */
  .cap::after { content: ""; position: absolute; left: 50%; top: 3px; width: 3px; height: 9px; margin-left: -1.5px; border-radius: 2px; background: #ffb347; }

  .presets { display: grid; grid-template-columns: repeat(6, 1fr); margin-top: 16px; }
  .presets button, .seek button { margin: 0 3px; padding: 8px 0; color: #ddd; border: 1px solid #000; border-radius: 4px; cursor: pointer; touch-action: none;
    background: linear-gradient(#8a8a8a, #3d3d3d); box-shadow: inset 0 1px #ccc, 0 3px #0a0a0a; font-family: inherit; }
  .presets button:active, .seek button:active { transform: translateY(2px); box-shadow: inset 0 1px #999, 0 1px #0a0a0a; }
  .presets b { display: block; font-size: 18px; }
  .presets small { font-size: 10px; opacity: .7; }
  .seek { display: flex; justify-content: center; margin-top: 10px; }
  .seek button { width: 34px; padding: 3px 0; margin: 0 2px; font-size: 10px; letter-spacing: -2px; color: #ddd; }
  .seek #pwr { width: 72px; letter-spacing: 0; font-size: 12px; line-height: 12px; }
  .seek #pwr.on { color: #ffb347; }
  .seek #pwr.on svg { filter: drop-shadow(0 0 3px #ff9d1f); }
  .seek #pwr svg { display: block; margin: 0 auto; }
  .presets button.on { color: #ffb347; text-shadow: 0 0 6px #ff9d1f; }
  .hint { margin-top: 12px; font-size: 10px; color: #777; text-align: center; letter-spacing: .5px; }

  @media (hover: none) { .hint { display: none; } } /* keyboard shortcuts are useless on touch */
  @media (pointer: coarse) { /* finger-sized knobs and seek/power buttons */
    :root { --cap: 84px; }
    .knob { width: 92px; }
    .seek button { width: 42px; padding: 10px 0; }
    .seek #pwr { width: 88px; }
  }
  @media (max-width: 520px) and (orientation: landscape) {
    .dial { flex-basis: 100%; order: -1; margin: 0 0 16px; }
  }
  /* Portrait phones: vertical dial on the left, knobs stacked on the right, presets 3x2 below */
  @media (max-width: 520px) and (orientation: portrait) {
    .unit { height: min(calc(100dvh - 32px), 760px); display: flex; flex-direction: column; }
    .top { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr auto; grid-template-areas: "dial vol" "dial tune"; column-gap: 16px; }
    .dial { grid-area: dial; margin: 0; height: auto; }
    .knob:first-child { grid-area: vol; justify-content: flex-start; }
    .knob:last-child { grid-area: tune; justify-content: flex-end; }
    .tick { top: calc(100% - var(--p)); left: 36px; width: 8px; height: 1px; }
    .tick.major { top: calc(100% - var(--p)); left: 30px; width: 14px; height: 1px; }
    .label { top: calc(100% - var(--p)); left: 6px; transform: translateY(-50%); }
    .dot { top: calc(100% - var(--p)); left: 50px; margin: -2px 0 0; }
    .needle { top: calc(100% - var(--p)); left: 4px; width: 56px; bottom: auto; height: 2px; margin: -1px 0 0; }
    .readout { left: 64px; right: 8px; top: 50%; bottom: auto; transform: translateY(-50%); flex-direction: column; align-items: center; text-align: center; white-space: normal; }
    .readout #freq { font-size: 22px; margin-bottom: 8px; }
    .readout span:last-child { margin-left: 0; }
    .lamp { top: 12px; right: 0; left: 64px; text-align: center; }
    .presets { grid-template-columns: repeat(3, 1fr); row-gap: 10px; }
  }
</style>
</head>
<body>
<div class="unit">
  <div class="top">
    <div class="knob"><div class="capwrap"><div class="cap" id="vol"></div><span class="face">VOL</span></div>
      <div class="seek"><button id="pwr" title="Power (space, or click the VOL knob)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 2v9"/><path d="M6.3 5.7a8 8 0 1 0 11.4 0"/></svg></button></div></div>
    <div class="dial off" id="dial">
      <div class="needle" id="needle"></div>
      <div class="lamp" id="lamp">STEREO</div>
      <div class="readout"><span id="freq"></span><span id="status"></span></div>
    </div>
    <div class="knob"><div class="capwrap"><div class="cap" id="tune"></div><span class="face">TUNE</span></div>
      <div class="seek"><button id="seekDown" title="Seek down (shift+←)">◀◀</button><button id="seekUp" title="Seek up (shift+→)">▶▶</button></div></div>
  </div>
  <div class="presets" id="presets"></div>
  <div class="hint">hold a preset to store · keys: 1–6 · shift+1–6 store · ←→ tune · shift+←→ seek · ↑↓ vol · space power</div>
</div>
<audio id="audio"></audio>
<script>
// Your stations, placed at their real FM frequencies.
var STATIONS = [
  { f: 91.1, name: "Hard Rock Heaven", url: "https://hydra.cdnstream.com/1521_128" }, // internet-only; frequency made up
  { f: 94.9, name: "Super 94.9 Cuenca", url: "https://dattavolt.com/8028/stream" },
  { f: 96.3, name: "WRock Cebu", url: "https://wrockceb-iradioph.radioca.st/stream" },
  { f: 100.7, name: "ICRT Taiwan", url: "https://n27a-eu.rcs.revma.com/nkdfurztxp3vv" },
  { f: 105.7, name: "Triple J Sydney", url: "https://mediaserviceslive.akamaized.net/hls/live/2038308/triplejnsw/master.m3u8" }
];
STATIONS.sort(function (a, b) { return a.f - b.f; }); // seek relies on this order
var LO = 88, HI = 108;

function load(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function $(id) { return document.getElementById(id); }
function pct(f) { return 5 + (f - LO) / (HI - LO) * 90; }

var audio = $("audio"), dial = $("dial");
var freq = load("freq", 91.1), vol = load("vol", 0.8), presets = load("presets", [91.1, 100.7, 94.9, 96.3, 105.7, null]);
var power = false, station = null, onAir = false, failed = false, hls = null, timer, msg = "", msgTimer, seekTimer;

// Dial face
for (var f = LO; f <= HI; f++) {
  var t = document.createElement("div");
  t.className = f % 2 ? "tick" : "tick major";
  t.style.setProperty("--p", pct(f) + "%");
  dial.appendChild(t);
  if (f % 2 === 0) {
    var l = document.createElement("div");
    l.className = "label"; l.textContent = f; l.style.setProperty("--p", pct(f) + "%");
    dial.appendChild(l);
  }
}
STATIONS.forEach(function (s) {
  var d = document.createElement("div");
  d.className = "dot"; d.style.setProperty("--p", pct(s.f) + "%");
  dial.appendChild(d);
});

// Static between stations
var ctx, hiss;
function initHiss() {
  if (ctx) return ctx.resume();
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  var buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  var src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  hiss = ctx.createGain(); hiss.gain.value = 0;
  src.connect(hiss); hiss.connect(ctx.destination); src.start();
}

function refresh() {
  $("needle").style.setProperty("--p", pct(freq) + "%");
  $("tune").style.transform = "rotate(" + (freq - LO) * 90 + "deg)";
  $("vol").style.transform = "rotate(" + (-135 + vol * 270) + "deg)";
  dial.classList.toggle("off", !power);
  $("lamp").classList.toggle("on", power && onAir);
  $("pwr").classList.toggle("on", power);
  $("freq").textContent = freq.toFixed(1) + " FM";
  $("status").textContent = msg || (!power ? "OFF" : !station ? "" : failed ? "no signal" : onAir ? station.name : "tuning…");
  if (hiss) hiss.gain.value = power && !onAir ? vol * 0.06 : 0;
  var btns = document.querySelectorAll(".preset");
  for (var i = 0; i < 6; i++) {
    btns[i].classList.toggle("on", power && presets[i] === freq);
    btns[i].lastChild.textContent = presets[i] == null ? "—" : presets[i].toFixed(1);
  }
}

function flash(text) { msg = text; clearTimeout(msgTimer); msgTimer = setTimeout(function () { msg = ""; refresh(); }, 1500); refresh(); }

function stopAudio() {
  clearTimeout(timer);
  if (hls) { hls.destroy(); hls = null; }
  audio.pause(); audio.removeAttribute("src"); audio.load();
  onAir = false; failed = false;
}

function withHls(cb) {
  if (window.Hls) return cb();
  var s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.6.15/hls.min.js";
  s.onload = cb;
  document.head.appendChild(s);
}

function start() {
  stopAudio();
  var st = station;
  if (power && st) timer = setTimeout(function () { // debounce so spinning the dial doesn't open every stream it passes
    if (/\.m3u8/.test(st.url) && !audio.canPlayType("application/vnd.apple.mpegurl")) {
      withHls(function () {
        if (station !== st || !power) return;
        hls = new Hls();
        hls.on(Hls.Events.ERROR, function (e, d) { if (d.fatal) { failed = true; refresh(); } });
        hls.loadSource(st.url); hls.attachMedia(audio);
        audio.play().catch(function () {});
      });
    } else {
      audio.src = st.url;
      audio.play().catch(function () {});
    }
  }, 350);
  refresh();
}

function setFreq(f, auto) {
  if (!auto) clearInterval(seekTimer); // manual tuning cancels a seek in progress
  f = Math.round(Math.min(HI, Math.max(LO, f)) * 10) / 10;
  if (f === freq) return;
  freq = f; save("freq", f);
  var st = null;
  STATIONS.forEach(function (s) { if (Math.abs(s.f - f) < 0.25) st = s; });
  if (st !== station) { station = st; start(); } else refresh();
}

// Sweep the needle to the next station in that direction, wrapping around the band
function seek(dir) {
  clearInterval(seekTimer);
  if (!power) setPower(true);
  var ahead = STATIONS.filter(function (s) { return s !== station && (dir > 0 ? s.f > freq : s.f < freq); });
  var target = ahead.length ? ahead[dir > 0 ? 0 : ahead.length - 1] : STATIONS[dir > 0 ? 0 : STATIONS.length - 1];
  if (target === station) return;
  if (document.hidden) return setFreq(target.f, true); // lock-screen seek: timers are throttled, skip the sweep
  seekTimer = setInterval(function () {
    var f = freq + dir * 0.1;
    setFreq(f > HI ? LO : f < LO ? HI : f, true);
    if (station === target) { clearInterval(seekTimer); setFreq(target.f, true); } // snap needle onto the station
  }, 12);
}

function setVol(v) {
  vol = Math.min(1, Math.max(0, v)); audio.volume = vol; save("vol", vol); refresh();
}

function setPower(p) { power = p; initHiss(); start(); }

function store(i) { presets[i] = freq; save("presets", presets); flash("P" + (i + 1) + " stored"); }

function recall(i) { if (presets[i] == null) return; clearInterval(seekTimer); if (!power) setPower(true); setFreq(presets[i], true); refresh(); }

// Knobs: drag up/down or scroll; a click without dragging calls onClick
function knob(el, onTurn, onClick) {
  var y0 = null, moved;
  el.addEventListener("pointerdown", function (e) { y0 = e.clientY; moved = false; el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", function (e) {
    if (y0 === null) return;
    var d = y0 - e.clientY;
    if (Math.abs(d) >= 4) { moved = true; y0 = e.clientY; onTurn(d); }
  });
  el.addEventListener("pointerup", function () { if (!moved && onClick) onClick(); y0 = null; });
  el.addEventListener("pointercancel", function () { y0 = null; });
  el.addEventListener("wheel", function (e) { e.preventDefault(); onTurn(e.deltaY < 0 ? 8 : -8); }, { passive: false });
}
knob($("vol"), function (d) { setVol(vol + d * 0.005); }, function () { setPower(!power); });
knob($("tune"), function (d) { setFreq(freq + d * 0.025); });
dial.onclick = function (e) {
  var r = dial.getBoundingClientRect(), vertical = r.height > r.width; // portrait phones: 88 at the bottom, 108 at the top
  var p = vertical ? (r.bottom - e.clientY) / r.height : (e.clientX - r.left) / r.width;
  setFreq(LO + (p * 100 - 5) / 90 * (HI - LO));
};

// Presets: tap to recall, hold to store
presets.forEach(function (p, i) {
  var b = document.createElement("button"), hold, held;
  b.className = "preset";
  b.innerHTML = "<b>" + (i + 1) + "</b><small></small>";
  b.addEventListener("pointerdown", function () { held = false; hold = setTimeout(function () { held = true; store(i); }, 600); });
  b.addEventListener("pointerup", function () { clearTimeout(hold); if (!held) recall(i); });
  b.addEventListener("pointerleave", function () { clearTimeout(hold); });
  b.addEventListener("pointercancel", function () { clearTimeout(hold); });
  b.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  $("presets").appendChild(b);
});
$("pwr").onclick = function () { setPower(!power); };
$("seekDown").onclick = function () { seek(-1); };
$("seekUp").onclick = function () { seek(1); };

function unlock() {
  document.removeEventListener("pointerup", unlock, true);
  document.removeEventListener("keydown", unlock, true);
  initHiss();
  if (!audio.getAttribute("src")) { audio.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="; audio.play().catch(function () {}); }
}
document.addEventListener("pointerup", unlock, true);
document.addEventListener("keydown", unlock, true);

// Lock screen / headphone controls
if ("mediaSession" in navigator) {
  var ms = navigator.mediaSession;
  ms.setActionHandler("play", function () { setPower(true); });
  ms.setActionHandler("pause", function () { setPower(false); });
  ms.setActionHandler("nexttrack", function () { seek(1); });
  ms.setActionHandler("previoustrack", function () { seek(-1); });
}

function realSrc() { return /^https?:|^blob:/.test(audio.currentSrc || audio.src); } // not the silent unlock clip

audio.addEventListener("playing", function () {
  if (!realSrc()) return;
  onAir = true; refresh();
  if ("mediaSession" in navigator && station) navigator.mediaSession.metadata = new MediaMetadata({ title: station.name, artist: station.f.toFixed(1) + " FM", album: "Car Radio" });
});
audio.addEventListener("waiting", function () { onAir = false; refresh(); });
audio.addEventListener("error", function () { if (audio.getAttribute("src") && realSrc()) { failed = true; onAir = false; refresh(); } });

document.addEventListener("keydown", function (e) {
  var n = /^Digit([1-6])$/.exec(e.code);
  if (n) return e.shiftKey ? store(n[1] - 1) : recall(n[1] - 1);
  var k = { " ": function () { setPower(!power); }, ArrowUp: function () { setVol(vol + 0.05); }, ArrowDown: function () { setVol(vol - 0.05); },
            ArrowRight: function () { e.shiftKey ? seek(1) : setFreq(freq + 0.1); }, ArrowLeft: function () { e.shiftKey ? seek(-1) : setFreq(freq - 0.1); } }[e.key];
  if (k) { e.preventDefault(); k(); }
});

audio.volume = vol;
STATIONS.forEach(function (s) { if (Math.abs(s.f - freq) < 0.25) station = s; });
refresh();
</script>
</body>
</html>
